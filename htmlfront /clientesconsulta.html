<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PratinhoPraTudo | Central de Cupons e Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="./logopratinho.jpeg" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght=400;600;700;800;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      .ifood-red {
        color: #ea1d2c;
      }
      .bg-ifood-red {
        background-color: #ea1d2c;
      }
      .bg-ifood-red-hover:hover {
        background-color: #cc1421;
      }
      .tracking-tightest {
        letter-spacing: -0.05em;
      }

      /* Transição suave para o carrossel dinâmico */
      .carousel-item {
        display: none;
        opacity: 0;
        transition: opacity 0.6s ease-in-out;
      }
      .carousel-item.active {
        display: block;
        opacity: 1;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col antialiased">
    <header
      class="w-full bg-white border-b border-gray-100 shadow-sm sticky top-0 z-40"
    >
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-4">
          <div
            class="relative w-12 h-12 bg-white p-0.5 rounded-xl shadow border border-gray-100 flex items-center justify-center overflow-hidden"
          >
            <img
              src="./logopratinho.jpeg"
              alt="Logo"
              class="w-full h-full object-cover rounded-xl"
            />
          </div>
          <div>
            <h1 class="text-2xl font-[800] text-gray-900 tracking-tightest">
              PratinhoPra<span class="text-[#ea1d2c]">Tudo</span>
              <span
                class="text-sm font-bold text-gray-400 uppercase tracking-widest ml-2"
                >Ofertas</span
              >
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a
            href="indexcliente.html"
            class="bg-ifood-red bg-ifood-red-hover text-white font-bold px-5 py-3 rounded-xl flex items-center gap-2 shadow-md transition-all transform active:scale-95 text-sm"
          >
            <i class="fa-solid fa-basket-shopping"></i> Ir para a Sacola
          </a>
        </div>
      </div>
    </header>

    <div
      class="relative w-full overflow-hidden bg-gray-900 h-[280px] md:h-[340px]"
    >
      <div id="carousel-wrapper" class="h-full w-full">
        <div
          class="carousel-item active h-full bg-gradient-to-r from-red-700 to-[#ea1d2c] flex flex-col justify-center items-center text-white"
        >
          <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
          <p class="font-bold tracking-wide text-sm">
            Sincronizando melhores ofertas...
          </p>
        </div>
      </div>

      <div id="carousel-controls" class="hidden">
        <button
          onclick="prevSlide()"
          class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 text-white w-10 h-10 rounded-full flex items-center justify-center transition-all z-10"
        >
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button
          onclick="nextSlide()"
          class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 text-white w-10 h-10 rounded-full flex items-center justify-center transition-all z-10"
        >
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <div
        class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-10"
        id="carousel-dots"
      ></div>
    </div>

    <div class="max-w-6xl w-full mx-auto px-4 mt-8 space-y-8">
      <div
        class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between"
      >
        <div class="space-y-1 text-center md:text-left">
          <h3 class="font-extrabold text-gray-800 text-base">
            Tem um cupom específico?
          </h3>
          <p class="text-xs text-gray-400">
            Insira o código promocional abaixo para validar as regras em tempo
            real.
          </p>
        </div>

        <div class="relative w-full md:max-w-md">
          <i
            class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"
          ></i>
          <input
            type="text"
            id="search-input"
            oninput="filterAndRenderAll()"
            placeholder="Digite o código (Ex: QUERO10)..."
            class="w-full pl-10 pr-24 py-3 bg-gray-50 border-transparent border-2 rounded-xl focus:bg-white focus:border-[#ea1d2c] outline-none transition-all text-sm uppercase font-mono font-bold tracking-wider"
          />
          <span
            class="absolute right-3 top-2.5 text-[10px] font-bold uppercase tracking-wider bg-gray-200 text-gray-600 px-2 py-1.5 rounded-lg"
          >
            Buscar
          </span>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 pb-2 border-b border-gray-200">
        <button
          onclick="changeCategory('all', this)"
          class="category-btn px-4 py-2 bg-[#ea1d2c] text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-sm transition"
        >
          <i class="fa-solid fa-border-all mr-1"></i> Todos os Cupons
        </button>
        <button
          onclick="changeCategory('percentage', this)"
          class="category-btn px-4 py-2 bg-white hover:bg-gray-100 text-gray-700 font-bold text-xs uppercase tracking-wider rounded-xl border border-gray-200 transition"
        >
          <i class="fa-solid fa-percent mr-1"></i> Porcentagem
        </button>
        <button
          onclick="changeCategory('fixed', this)"
          class="category-btn px-4 py-2 bg-white hover:bg-gray-100 text-gray-700 font-bold text-xs uppercase tracking-wider rounded-xl border border-gray-200 transition"
        >
          <i class="fa-solid fa-money-bill-wave mr-1"></i> Valor Fixo
        </button>
      </div>

      <div
        id="coupons-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-12"
      ></div>
    </div>

    <footer
      class="w-full text-center py-6 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-400 border-t border-gray-100 bg-white mt-auto"
    >
      v1.5.0 - Central de Cupons 100% Automatizada
    </footer>

    <script src="./consultaclientes.js"></script>
  </body>
</html>
